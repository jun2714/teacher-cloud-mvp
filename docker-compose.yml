# 本地 Docker 开发：浏览器访问 http://127.0.0.1:6060
# 后端在容器内 8000，映射到宿主机 8001（与本机 Vite 代理一致）
services:
  backend:
    build: ./backend
    working_dir: /app
    entrypoint: ["/bin/sh", "-c"]
    command:
      - python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
      - /app/.venv
      - backend_data:/app/data
      - backend_media:/app/media
    ports:
      - "8001:8000"
    env_file:
      - ./backend/.env
    environment:
      DEBUG: "1"
      SQLITE_PATH: /app/data/db.sqlite3

  frontend:
    build: ./frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 6060"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "6060:6060"
    environment:
      VITE_API_PROXY: http://backend:8000
    depends_on:
      - backend

volumes:
  backend_data:
  backend_media:
  frontend_node_modules:
