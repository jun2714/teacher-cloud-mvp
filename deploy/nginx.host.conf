# 直接部署在 Linux 服务器上时，复制到 /etc/nginx/conf.d/jiaoyanyun.conf
# 把 your.domain.com 换成实际域名或服务器 IP
server {
    listen 80;
    server_name your.domain.com;
    client_max_body_size 80m;

    root /var/www/jiaoyanyun/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /static/ {
        alias /var/www/jiaoyanyun/backend/staticfiles/;
        expires 7d;
    }

    location /media/ {
        alias /var/www/jiaoyanyun/backend/media/;
        expires 7d;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
